version: '3.9'

# CATERYA Agentic Enterprise — Docker Compose
# Author: Ary HH (Caterya Tech) <aryhharyanto@proton.me>
# Run: docker-compose up -d
# Dashboard: http://localhost:8501

services:

  # ─── Dashboard ──────────────────────────────────────────────────────────────
  dashboard:
    build: .
    container_name: caterya_dashboard
    ports:
      - "8501:8501"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - POSTGRES_URL=postgresql://caterya:caterya_secure@postgres:5432/caterya_db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - ollama
      - postgres
      - redis
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - caterya_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Ollama (Local LLM) ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: caterya_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - caterya_net
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: caterya_postgres
    environment:
      POSTGRES_DB: caterya_db
      POSTGRES_USER: caterya
      POSTGRES_PASSWORD: caterya_secure
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - caterya_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caterya -d caterya_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: caterya_redis
    command: redis-server --appendonly yes --requirepass caterya_redis_pass
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - caterya_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── ChromaDB (Vector Store) ──────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: caterya_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    networks:
      - caterya_net

  # ─── Grafana (Observability) ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: caterya_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=caterya_admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - caterya_net
    profiles:
      - monitoring

volumes:
  ollama_models:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
  grafana_data:
    driver: local

networks:
  caterya_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
