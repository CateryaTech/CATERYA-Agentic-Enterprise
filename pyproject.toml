[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caterya-agentic-enterprise"
version = "1.0.0"
description = "CATERYA Agentic Enterprise — Offline-first, Crypto-native, Ethics-first AI Workforce"
readme = "README.md"
requires-python = ">=3.12,<4.0"
license = {text = "Proprietary — All Rights Reserved © 2026 Caterya Tech"}
authors = [
  {name = "Ary HH (Caterya Tech)", email = "aryhharyanto@proton.me"}
]
keywords = ["agentic", "offline", "crypto", "llm", "langgraph", "privacy-first"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Private :: Do Not Upload",
]

dependencies = [
  # LLM & Agentic Core
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-ollama>=0.2.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "crewai>=0.80.0",

  # Dashboard
  "streamlit>=1.40.0",

  # Databases & State
  "redis>=5.0.0",
  "psycopg2-binary>=2.9.9",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",

  # Vector Store
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",

  # Crypto & Blockchain
  "cryptography>=43.0.0",
  "web3>=7.0.0",
  "eth-account>=0.13.0",
  # solana & solders: no Python 3.13 wheel — use pure JSON-RPC fallback in crypto_manager.py
  # install locally only: pip install solana solders bitcoinlib
  "solana>=0.35.0; python_version < '3.13'",
  "solders>=0.21.0; python_version < '3.13'",
  "bitcoinlib>=0.6.15; python_version < '3.13'",

  # HTTP & Networking
  "httpx>=0.27.0",
  "aiohttp>=3.10.0",
  "requests>=2.32.0",

  # Tools & Utilities
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.0",
  "rich>=13.8.0",
  "typer>=0.12.0",
  "schedule>=1.2.0",
  "apscheduler>=3.10.0",

  # Observability
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "prometheus-client>=0.21.0",

  # Security
  "argon2-cffi>=23.1.0",
  "pyotp>=2.9.0",

  # Export / Reports
  "reportlab>=4.0.0",
  "openpyxl>=3.1.5",

  # File Processing
  "pypdf>=5.0.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.5",
  "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7.0",
  "mypy>=1.12.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ipython>=8.28.0",
]

[project.scripts]
caterya = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.hatch.envs.default]
features = ["dev"]
